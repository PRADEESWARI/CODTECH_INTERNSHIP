<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Certificate - CodTech</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Certificate Page */
    .certificate-page {
      max-width: 800px;
      margin: auto;
      padding: 30px;
      text-align: center;
    }

    .certificate-page h2 {
      color: #003366;
      font-size: 2em;
      margin-bottom: 10px;
    }

    .certificate-page p {
      font-size: 1.1em;
    }

    #cert-status {
      font-weight: bold;
      color: green;
      margin-top: 10px;
    }

    #cert-status.not-eligible {
      color: red;
    }

    /* Thumbnail */
    .certificate-image {
      margin-top: 30px;
      display: none;
      width: 300px;
      height: auto;
      border: 3px solid #ccc;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
    }

    /* Modal for large view */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      padding-top: 60px;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.8);
    }

    .modal-content {
      display: block;
      margin: auto;
      max-width: 80%;
      max-height: 80%;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    .close {
      position: absolute;
      top: 25px;
      right: 35px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <img src="assets/logo.png" alt="CodTech Logo" class="logo" />
    <nav>
      <a href="index.html">Home</a>
      <a href="progress.html">My Progress</a>
      <a href="certificate.html">Certificate</a>
    </nav>
  </header>

  <main class="certificate-page">
    <h2>🎓 Your Course Certificate</h2>
    <p>Certificates are issued upon successful course completion.</p>
    <p><strong>Status:</strong> <span id="cert-status">Checking...</span></p>

    <!-- Certificate thumbnail (clickable) -->
    <img id="certificate-img" class="certificate-image" src="assets/certificate_webdev.jpg.png" alt="Web Dev Certificate" />

    <!-- Modal Popup -->
    <div id="modal" class="modal">
      <span class="close" id="modal-close">&times;</span>
      <img class="modal-content" id="modal-img" />
    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
